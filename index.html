<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SlashPH Lordnine Boss Timers</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ---------- Global Styles ---------- */
body {
  margin: 0;
  padding: 0;
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #050510 0%, #0a0a1f 50%, #050510 100%);
  color: #eee;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---------- Header ---------- */
header {
  text-align: center;
  margin: 40px 0 20px;
  position: relative;
}
header h1 {
  font-size: 48px;
  background: linear-gradient(90deg, #0ff, #ff0, #f0f);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
  text-transform: uppercase;
  animation: hueRotate 6s linear infinite;
}
header h2 {
  font-size: 20px;
  color: #aaa;
  letter-spacing: 6px;
  margin-top: 6px;
  font-weight: 500;
}
@keyframes hueRotate {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

/* ---------- Next Boss Banner ---------- */
#next-banner {
  font-size: 20px;
  color: #0ff;
  padding: 12px 28px;
  margin: 20px 0 40px;
  border-radius: 14px;
  border: 2px solid #0ff;
  text-transform: uppercase;
  text-shadow: 0 0 12px #0ff, 0 0 25px #0ff;
  animation: pulseGlow 2s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
  from { box-shadow: 0 0 8px #0ff; }
  to { box-shadow: 0 0 25px #0ff, 0 0 50px #0ff; }
}

/* ---------- Boss Container ---------- */
.boss-container {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap: 26px;
  width: 95%;
  max-width: 1400px;
  padding: 20px;
  box-sizing: border-box;
}

/* ---------- Boss Card ---------- */
.boss {
  background: rgba(20,20,35,0.9);
  border: 1px solid rgba(0,255,255,.4);
  padding: 20px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,255,255,.25);
  backdrop-filter: blur(6px);
  transition: transform .3s ease, box-shadow .3s ease;
  position: relative;
  overflow: hidden;
}
.boss::before {
  content:"";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 180deg, transparent, rgba(0,255,255,0.3), transparent 30%);
  animation: spin 6s linear infinite;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}
.boss:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow: 0 0 35px rgba(0,255,255,.6);
}

/* ---------- Highlighting ---------- */
.boss.highlight { border:2px solid #ff0; box-shadow:0 0 30px #ff0; }
.boss.upcoming { border:2px dashed #f0f; box-shadow:0 0 30px #f0f; }
.boss.manual   { border:2px solid #0f0 !important; box-shadow:0 0 30px #0f0 !important; }

/* ---------- Text Styles ---------- */
.boss h3 {
  margin: 0 0 12px;
  font-size: 22px;
  color: #0ff;
  letter-spacing: 1px;
  position: relative;
  z-index: 1;
}
.timer {
  font-family: 'Share Tech Mono', monospace;
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 12px;
  color: #fff;
  text-shadow: 0 0 12px #0ff;
  position: relative;
  z-index: 1;
}
.next { font-size: 15px; color: #ccc; margin-bottom: 14px; z-index: 1; position: relative; }
.reminder { font-size: 12px; color: #666; margin-bottom: 12px; z-index: 1; position: relative; }

/* ---------- Inputs & Controls ---------- */
.manual-entry {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.manual-entry input {
  background: #0a0a14;
  border: 1px solid #0ff;
  color: #fff;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 13px;
  width: 130px;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

/* ---------- Buttons ---------- */
button {
  background: linear-gradient(145deg, #0a0a14, #111122);
  border: 1px solid #0ff;
  color: #0ff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: .25s ease;
}
button:hover {
  background: linear-gradient(145deg, #0ff, #0aa);
  color: #111;
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 0 15px #0ff;
}
.reset-btn { margin-bottom: 20px; }

/* ---------- Status Colors ---------- */
.spawned { color: #0f0; text-shadow:0 0 10px #0f0; }
.alert   { color: #ff0080; text-shadow:0 0 10px #ff0080; }
</style>
</head>
<body>

<header>
  <h1>SlashPH Lordnine</h1>
  <h2>BOSS TIMERS</h2>
</header>

<div class="reset-btn">
  <button onclick="resetAll()">RESET ALL TIMERS</button>
</div>

<div id="next-banner">Next Boss: Calculating...</div>
<div class="boss-container" id="bossContainer"></div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Respawn Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; }
    .boss-card { background:#222; padding:15px; margin:10px; border-radius:8px; }
    .boss-name { font-size:20px; font-weight:bold; margin-bottom:5px; }
    #next-banner { background:#444; padding:10px; margin:10px; border-radius:8px; font-size:18px; }
  </style>
</head>
<body>
  <h2>Boss Respawn Tracker</h2>
  <div id="next-banner">Loading...</div>
  <div id="boss-list"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const bosses = [
    // Every X hours type
    { name:"Lady Dalia", respawnHours:18, lastDeath:new Date("2025-08-27T03:20:00+08:00") },
    { name:"Venatus", respawnHours:10, lastDeath:new Date("2025-08-27T05:45:00+08:00") },
    { name:"EGO", respawnHours:21, lastDeath:new Date("2025-08-27T14:13:00+08:00") },
    { name:"Venatus (2nd)", respawnHours:10, lastDeath:new Date("2025-08-29T07:09:00+08:00") },
    { name:"Livera", respawnHours:24, lastDeath:new Date("2025-08-29T11:30:00+08:00") },
    { name:"Araneo (24h)", respawnHours:24, lastDeath:new Date("2025-08-29T11:50:00+08:00") },
    { name:"Araneo (21h)", respawnHours:21, lastDeath:new Date("2025-08-29T08:15:00+08:00") },

    // Weekly fixed spawns
    { name:"Thymele", fixed: [
      { day:1, time:"19:00" },  // Monday 19:00
      { day:3, time:"11:30" }   // Wednesday 11:30
    ]},
    { name:"Clemantis", fixed: [
      { day:1, time:"11:30" },  // Monday 11:30
      { day:4, time:"19:00" }   // Thursday 19:00
    ]},
    { name:"Neutro", fixed: [
      { day:2, time:"19:00" },  // Tuesday 19:00
      { day:4, time:"11:30" }   // Thursday 11:30
    ]},
    { name:"Ringor", fixed: [
      { day:6, time:"17:00" }   // Saturday 17:00
    ]}
  ];

  function formatDateTime(dt){
    const ph = dt.toLocaleString('en-US', { timeZone:'Asia/Manila', weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    const kr = dt.toLocaleString('en-US', { timeZone:'Asia/Tokyo', weekday:'short', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    return `PH: ${ph} | KR/JP: ${kr}`;
  }

  // compute next spawn for respawnHours or fixed schedule
  function getNextSpawn(boss){
    const now = new Date();

    if(boss.respawnHours){
      let next = new Date(boss.lastDeath.getTime() + boss.respawnHours*3600*1000);
      while(next < now){
        next = new Date(next.getTime() + boss.respawnHours*3600*1000);
      }
      return next;
    }

    if(boss.fixed){
      let soonest = null;
      boss.fixed.forEach(sch=>{
        const [h,m] = sch.time.split(":").map(Number);
        const base = new Date(now);
        // adjust to PH timezone (Asia/Manila)
        base.setUTCHours(h-8, m, 0, 0); 
        // find this week or next week schedule
        base.setUTCDate(base.getUTCDate() + ((sch.day+7 - base.getUTCDay())%7));
        if(base < now) base.setUTCDate(base.getUTCDate()+7);
        if(!soonest || base < soonest) soonest = base;
      });
      return soonest;
    }
    return null;
  }

  function updateTimers(){
    let soonestBoss=null;

    bosses.forEach((boss,i)=>{
      const next = getNextSpawn(boss);
      if(!next) return;
      const diff = next - new Date();
      const h=Math.floor(diff/3600000);
      const m=Math.floor((diff%3600000)/60000);
      const s=Math.floor((diff%60000)/1000);

      const card=document.getElementById("boss-"+i);
      if(card){
        card.querySelector(".countdown").textContent=`Respawns in: ${h}h ${m}m ${s}s`;
        card.querySelector(".next").textContent=`Next: ${formatDateTime(next)}`;
      }

      if(!soonestBoss || next<soonestBoss.nextSpawn){
        soonestBoss={name:boss.name, nextSpawn:next};
      }
    });

    if(soonestBoss){
      document.getElementById("next-banner").textContent=
        `Next Boss: ${soonestBoss.name} at ${formatDateTime(soonestBoss.nextSpawn)}`;
    }
  }

  // create cards
  const list=document.getElementById("boss-list");
  bosses.forEach((boss,i)=>{
    const div=document.createElement("div");
    div.className="boss-card";
    div.id="boss-"+i;
    div.innerHTML=`
      <div class="boss-name">${boss.name}</div>
      <div class="countdown">Loading...</div>
      <div class="next">Loading...</div>
    `;
    list.appendChild(div);
  });

  setInterval(updateTimers,1000);
  updateTimers();
});
</script>

</body>
</html>

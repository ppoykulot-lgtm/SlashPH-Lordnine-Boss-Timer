<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SlashPH Lordnine Boss Timers</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ---------- Global Styles ---------- */
body {
  margin: 0;
  padding: 0;
  font-family: 'Orbitron', sans-serif;
  background: linear-gradient(135deg, #050510 0%, #0a0a1f 50%, #050510 100%);
  color: #eee;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---------- Header ---------- */
header {
  text-align: center;
  margin: 40px 0 20px;
  position: relative;
}
header h1 {
  font-size: 48px;
  background: linear-gradient(90deg, #0ff, #ff0, #f0f);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
  text-transform: uppercase;
  animation: hueRotate 6s linear infinite;
}
header h2 {
  font-size: 20px;
  color: #aaa;
  letter-spacing: 6px;
  margin-top: 6px;
  font-weight: 500;
}
@keyframes hueRotate {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

/* ---------- Next Boss Banner ---------- */
#next-banner {
  font-size: 20px;
  color: #0ff;
  padding: 12px 28px;
  margin: 20px 0 40px;
  border-radius: 14px;
  border: 2px solid #0ff;
  text-transform: uppercase;
  text-shadow: 0 0 12px #0ff, 0 0 25px #0ff;
  animation: pulseGlow 2s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
  from { box-shadow: 0 0 8px #0ff; }
  to { box-shadow: 0 0 25px #0ff, 0 0 50px #0ff; }
}

/* ---------- Boss Container ---------- */
.boss-container {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap: 26px;
  width: 95%;
  max-width: 1400px;
  padding: 20px;
  box-sizing: border-box;
}

/* ---------- Boss Card ---------- */
.boss {
  background: rgba(20,20,35,0.9);
  border: 1px solid rgba(0,255,255,.4);
  padding: 20px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,255,255,.25);
  backdrop-filter: blur(6px);
  transition: transform .3s ease, box-shadow .3s ease;
  position: relative;
  overflow: hidden;
}
.boss::before {
  content:"";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 180deg, transparent, rgba(0,255,255,0.3), transparent 30%);
  animation: spin 6s linear infinite;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}
.boss:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow: 0 0 35px rgba(0,255,255,.6);
}

/* ---------- Highlighting ---------- */
.boss.highlight { border:2px solid #ff0; box-shadow:0 0 30px #ff0; }
.boss.upcoming { border:2px dashed #f0f; box-shadow:0 0 30px #f0f; }
.boss.manual   { border:2px solid #0f0 !important; box-shadow:0 0 30px #0f0 !important; }

/* ---------- Text Styles ---------- */
.boss h3 {
  margin: 0 0 12px;
  font-size: 22px;
  color: #0ff;
  letter-spacing: 1px;
  position: relative;
  z-index: 1;
}
.timer {
  font-family: 'Share Tech Mono', monospace;
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 12px;
  color: #fff;
  text-shadow: 0 0 12px #0ff;
  position: relative;
  z-index: 1;
}
.next { font-size: 15px; color: #ccc; margin-bottom: 14px; z-index: 1; position: relative; }
.reminder { font-size: 12px; color: #666; margin-bottom: 12px; z-index: 1; position: relative; }

/* ---------- Inputs & Controls ---------- */
.manual-entry {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.manual-entry input {
  background: #0a0a14;
  border: 1px solid #0ff;
  color: #fff;
  padding: 6px 8px;
  border-radius: 6px;
  font-size: 13px;
  width: 130px;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

/* ---------- Buttons ---------- */
button {
  background: linear-gradient(145deg, #0a0a14, #111122);
  border: 1px solid #0ff;
  color: #0ff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: .25s ease;
}
button:hover {
  background: linear-gradient(145deg, #0ff, #0aa);
  color: #111;
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 0 15px #0ff;
}
.reset-btn { margin-bottom: 20px; }

/* ---------- Status Colors ---------- */
.spawned { color: #0f0; text-shadow:0 0 10px #0f0; }
.alert   { color: #ff0080; text-shadow:0 0 10px #ff0080; }
</style>
</head>
<body>

<header>
  <h1>SlashPH Lordnine</h1>
  <h2>BOSS TIMERS</h2>
</header>

<div class="reset-btn">
  <button onclick="resetAll()">RESET ALL TIMERS</button>
</div>

<div id="next-banner">Next Boss: Calculating...</div>
<div class="boss-container" id="bossContainer"></div>

<script>
/* === Original JS Code === */
const bosses = [
  // Respawn bosses (oras ng pagkamatay + interval)
  { name:'Lady Dalia', respawn:18*60*60, nextSpawn:'03:20 AM' },   // Wed, Aug 27, 2025 – 03:20 AM (PH)
  { name:'Venatus A', respawn:10*60*60, nextSpawn:'05:45 AM' },    // Wed, Aug 27, 2025 – 05:45 AM (PH)
  { name:'EGO', respawn:21*60*60, nextSpawn:'02:13 PM' },          // Wed, Aug 27, 2025 – 02:13 PM (PH)
  { name:'Venatus B', respawn:10*60*60, nextSpawn:'07:09 AM' },    // Fri, Aug 29, 2025 – 07:09 AM (PH)
  { name:'Livera', respawn:24*60*60, nextSpawn:'11:30 AM' },       // Fri, Aug 29, 2025 – 11:30 AM (PH)
  { name:'Araneo (24h)', respawn:24*60*60, nextSpawn:'11:50 AM' }, // Fri, Aug 29, 2025 – 11:50 AM (PH)
  { name:'Araneo (21h)', respawn:21*60*60, nextSpawn:'08:15 AM' }, // Fri, Aug 29, 2025 – 08:15 AM (PH)

  // Weekly fixed spawns
  { name:'Thymele', special:true, schedule:[
      {day:1,hour:19,minute:0},   // Monday 19:00
      {day:3,hour:11,minute:30}   // Wednesday 11:30
  ]},
  { name:'Clemantis', special:true, schedule:[
      {day:1,hour:11,minute:30},  // Monday 11:30
      {day:4,hour:19,minute:0}    // Thursday 19:00
  ]},
  { name:'Neutro', special:true, schedule:[
      {day:2,hour:19,minute:0},   // Tuesday 19:00
      {day:4,hour:11,minute:30}   // Thursday 11:30
  ]},
  { name:'Ringor', special:true, schedule:[
      {day:6,hour:17,minute:0}    // Saturday 17:00
  ]}
];


function nameToId(n){ return ('b-' + n.toLowerCase().trim().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')); }
function getBossById(id){ return bosses.find(b => nameToId(b.name) === id); }

function parseTime(str){
  const now = new Date();
  let [time, ampm] = str.split(' ');
  let [h,m] = time.split(':').map(Number);
  if(ampm && ampm.toLowerCase()==='pm' && h<12) h+=12;
  if(ampm && ampm.toLowerCase()==='am' && h===12) h=0;
  const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
  if(dt < now) dt.setDate(dt.getDate()+1);
  return dt;
}

function formatTime(ms){
  if(ms<=0) return 'SPAWNED!';
  const s=Math.floor(ms/1000);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

function getNextScheduled(schedule, fromTime=new Date()){
  let soonest=null;
  schedule.forEach(s=>{
    let next=new Date(fromTime);
    const diffDay=(s.day - fromTime.getDay() + 7)%7;
    next.setDate(fromTime.getDate()+diffDay);
    next.setHours(s.hour,s.minute,0,0);
    if(next<=fromTime) next.setDate(next.getDate()+7);
    if(!soonest || next < soonest) soonest = next;
  });
  return soonest;
}

function saveTimers() {
  const data = {};
  bosses.forEach(b => {
    data[nameToId(b.name)] = b.nextSpawn.getTime();
  });
  localStorage.setItem('bossTimers', JSON.stringify(data));
}

function loadTimers() {
  const data = JSON.parse(localStorage.getItem('bossTimers') || '{}');
  bosses.forEach(b => {
    const id = nameToId(b.name);
    if(data[id]){
      b.nextSpawn = new Date(data[id]);
    }
  });
}

function createUI(){
  const container=document.getElementById('bossContainer');
  bosses.forEach(b=>{
    const id=nameToId(b.name);
    if(b.special && !b.nextSpawn){
      b.nextSpawn=getNextScheduled(b.schedule);
    } else if(typeof b.nextSpawn==='string'){
      b.nextSpawn=parseTime(b.nextSpawn);
    } else if(!b.nextSpawn){
      b.nextSpawn=new Date(new Date().getTime()+b.respawn*1000);
    }
    const div=document.createElement('div');
    div.className='boss';
    div.id=`card-${id}`;
    div.innerHTML=`
      <h3>${b.name}</h3>
      <div class="timer" id="timer-${id}"></div>
      <div class="next" id="next-${id}"></div>
      <div class="reminder">Set a kill time or input next spawn</div>
      <div class="manual-entry">
        <input type="time" id="killTime-${id}" step="60" aria-label="Kill time for ${b.name}">
        <input type="datetime-local" id="nextSpawn-${id}" aria-label="Next spawn for ${b.name}">
      </div>
      <div class="controls">
        <button onclick="killedNow('${id}')">Killed Now</button>
        <button onclick="manualEntry('${id}')">Set Manual Kill Time</button>
        <button onclick="setNextSpawn('${id}')">Set Next Spawn</button>
      </div>
    `;
    container.appendChild(div);
  });
}

function updateTimers(){
  const now=new Date();
  let soonestBoss=null;
  const ALERT_THRESHOLD_MINUTES = 30;
  const threshold = ALERT_THRESHOLD_MINUTES * 60 * 1000;

  bosses.forEach(b=>{
    let next=b.nextSpawn;
    let diff=next-now;
    if(diff<=0 && b.respawn){
      b.nextSpawn=new Date(now.getTime()+b.respawn*1000);
      next=b.nextSpawn;
      diff=next-now;
    }
    if(!soonestBoss || next<soonestBoss.nextSpawn) soonestBoss=b;

    const id=nameToId(b.name);
    const timerEl=document.getElementById(`timer-${id}`);
    const nextEl=document.getElementById(`next-${id}`);
    const card=document.getElementById(`card-${id}`);

    if(timerEl && nextEl){
      timerEl.textContent=formatTime(diff);
      timerEl.className='timer';
      if(diff<=0) timerEl.classList.add('spawned');
      else if(diff<=10*60*1000) timerEl.classList.add('alert');
      nextEl.textContent=`Next: ${next.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}`;
    }

    if(card){
      card.style.order=Math.floor(diff/1000);
      card.classList.remove('upcoming','manual');
      if(diff > 0 && diff <= threshold) card.classList.add('upcoming');
      if(b.manual) card.classList.add('manual');
    }
  });

  if(soonestBoss){
    document.getElementById('next-banner').textContent=`Next Boss: ${soonestBoss.name} at ${soonestBoss.nextSpawn.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}`;
    document.querySelectorAll('.boss').forEach(c=>c.classList.remove('highlight'));
    const highlightCard=document.getElementById(`card-${nameToId(soonestBoss.name)}`);
    if(highlightCard) highlightCard.classList.add('highlight');
  }
}

function killedNow(id){
  const b=getBossById(id);
  const now=new Date();
  if(b.special && b.schedule){
    b.nextSpawn=getNextScheduled(b.schedule, now);
  } else if(b.respawn){
    b.nextSpawn=new Date(now.getTime()+b.respawn*1000);
  }
  b.manual=false;
  saveTimers();
}

function manualEntry(id){
  const input = document.getElementById(`killTime-${id}`);
  if(!input || !input.value) return;

  const now = new Date();
  const [h,m] = input.value.split(':').map(Number);
  let killTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
  if(killTime > now) killTime.setDate(killTime.getDate() - 1);

  const b = getBossById(id);

  if(b.special && b.schedule){
    b.nextSpawn = getNextScheduled(b.schedule, killTime);
  } else if(b.respawn){
    b.nextSpawn = new Date(killTime.getTime() + b.respawn*1000);
  } else {
    b.nextSpawn = new Date(killTime.getTime());
  }

  b.manual = true;
  saveTimers();
}

function setNextSpawn(id){
  const input = document.getElementById(`nextSpawn-${id}`);
  if(!input || !input.value) return;

  const next = new Date(input.value);
  if(isNaN(next.getTime())){
    alert('Invalid date/time');
    return;
  }

  const b = getBossById(id);
  b.nextSpawn = next;
  b.manual = true;
  saveTimers();
  updateTimers();
}

function resetAll(){
  localStorage.removeItem('bossTimers');
  bosses.forEach(b=>{
    if(!b.special && b.respawn){
      b.nextSpawn=new Date(new Date().getTime()+b.respawn*1000);
      b.manual=false;
    } else if(b.special && b.schedule){
      b.nextSpawn=getNextScheduled(b.schedule);
      b.manual=false;
    }
  });
  updateTimers();
}

createUI();
loadTimers();
updateTimers();
setInterval(updateTimers, 1000);
</script>

</body>
</html>

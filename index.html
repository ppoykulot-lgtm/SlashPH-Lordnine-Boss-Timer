<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SlashPH Lordnine Boss Timers</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Roboto+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #0f0f0f, #1c1c1c);
      font-family: 'Roboto Mono', monospace;
      color: #e4e4e4;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #111;
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #f5f5f5;
      letter-spacing: 1px;
      border-bottom: 2px solid #333;
    }
    #next-banner {
      text-align: center;
      font-size: 1.3rem;
      margin: 15px;
      color: #00ff99;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
      gap: 15px;
      padding: 20px;
    }
    .boss {
      background: #1f1f1f;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .boss:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }
    .boss.highlight {
      border: 2px solid #00ffcc;
      background: #262626;
    }
    .boss h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #ffcc00;
    }
    .timer {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #00ffcc;
    }
    .timer.alert {
      color: #ff4444;
    }
    .timer.spawned {
      color: #00ff00;
    }
    .next-time {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>SlashPH Lordnine Boss Timers</header>
  <div id="next-banner">Next Boss: Loading...</div>
  <div class="grid" id="boss-grid"></div>

  <script>
    const bosses = [
      { name:'Undomiel', respawn:24*60*60, nextSpawn:'12:05 AM' },
      { name:'Lady Daliah', respawn:18*60*60, nextSpawn:'12:25 PM' },
      { name:'Venatus', respawn:10*60*60, nextSpawn:'11:13 PM' }, 
      { name:'Viorent', respawn:10*60*60, nextSpawn:'11:15 PM' },
      { name:'Ego', respawn:21*60*60, nextSpawn:'10:49 AM' },
      { name:'Thymele', special:true, schedule:[{day:1,hour:19,minute:0},{day:3,hour:11,minute:30}] },
      { name:'Araneo', respawn:24*60*60, nextSpawn:'08:15 AM' },
      { name:'Livera', respawn:24*60*60, nextSpawn:'11:30 AM' },
      { name:'Clemantis', special:true, schedule:[{day:1,hour:11,minute:30},{day:4,hour:19,minute:0}] },
      { name:'Saphirus', special:true, schedule:[{day:0,hour:17,minute:0},{day:2,hour:11,minute:30}] },
      { name:'Neutro', special:true, schedule:[{day:2,hour:19,minute:0},{day:4,hour:11,minute:30}] },
      { name:'General Aquleus', respawn:29*60*60, nextSpawn:'02:00 AM' },
      { name:'Amentis', respawn:29*60*60, nextSpawn:'03:00 AM' },
      { name:'Baron Braudmore', respawn:32*60*60, nextSpawn:'05:00 AM' },
      { name:'Milavy', special:true, schedule:[{day:6,hour:15,minute:0}] },
      { name:'Wannitas', respawn:48*60*60, nextSpawn:'07:00 AM' },
      { name:'Metus', respawn:48*60*60, nextSpawn:'08:00 AM' },
      { name:'Duplican', respawn:48*60*60, nextSpawn:'09:00 AM' },
      { name:'Shuliar', respawn:35*60*60, nextSpawn:'10:00 AM' },
      { name:'Ringor', special:true, schedule:[{day:6,hour:17,minute:0}] },
      { name:'Roderick', special:true, schedule:[{day:5,hour:19,minute:0}] },
      { name:'Gareth', respawn:32*60*60, nextSpawn:'11:00 AM' },
      { name:'Titore', respawn:37*60*60, nextSpawn:'01:00 PM' },
      { name:'Larba', respawn:35*60*60, nextSpawn:'02:00 PM' },
      { name:'Catena', respawn:35*60*60, nextSpawn:'03:00 PM' },
      { name:'Auraq', special:true, schedule:[{day:0,hour:21,minute:0},{day:3,hour:21,minute:0}] }
    ];

    function nameToId(name){ return name.toLowerCase().replace(/\s+/g,'-'); }

    function formatTime(ms){
      if(ms<=0) return "SPAWNED!";
      let s=Math.floor(ms/1000);
      const d=Math.floor(s/86400); s%=86400;
      const h=Math.floor(s/3600); s%=3600;
      const m=Math.floor(s/60); s%=60;
      return (d>0?d+"d ":"")+(h>0?h+"h ":"")+(m>0?m+"m ":"")+s+"s";
    }

    function formatDateTime(dt){
      if(!(dt instanceof Date)) return '';
      const opts = { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
      return dt.toLocaleString('en-US', opts) + " (PH)";
    }

    function getNextScheduled(schedule, now){
      let soonest=null;
      for(let s of schedule){
        let d=new Date(now);
        d.setDate(now.getDate() + ((s.day+7-now.getDay())%7));
        d.setHours(s.hour, s.minute,0,0);
        if(d<=now) d.setDate(d.getDate()+7);
        if(!soonest||d<soonest) soonest=d;
      }
      return soonest;
    }

    function updateTimers(){
      const now=new Date();
      let soonestBoss=null;
      const ALERT_THRESHOLD_MINUTES=30;
      const threshold=ALERT_THRESHOLD_MINUTES*60*1000;

      bosses.forEach(b=>{
        let next=b.nextSpawn;
        if(typeof next==="string"){
          let d=new Date(now);
          let [time,ampm]=next.split(" ");
          if(time){
            let [hh,mm]=time.split(":");
            hh=parseInt(hh)||0; mm=parseInt(mm)||0;
            if(ampm==="PM" && hh!==12) hh+=12;
            if(ampm==="AM" && hh===12) hh=0;
            d.setHours(hh,mm,0,0);
            if(d<=now) d.setDate(d.getDate()+1);
            b.nextSpawn=d;
            next=d;
          }
        }
        let diff=next-now;

        if(diff<=0 && b.respawn){
          while(next<=now){
            next=new Date(next.getTime()+b.respawn*1000);
          }
          b.nextSpawn=next;
          diff=next-now;
        }
        if(b.special && b.schedule){
          if(diff<=0 || !b.nextSpawn){
            b.nextSpawn=getNextScheduled(b.schedule, now);
            next=b.nextSpawn;
            diff=next-now;
          }
        }
        if(!soonestBoss||next<soonestBoss.nextSpawn) soonestBoss=b;

        const id=nameToId(b.name);
        const timerEl=document.getElementById(`timer-${id}`);
        const nextEl=document.getElementById(`next-${id}`);
        const card=document.getElementById(`card-${id}`);

        if(timerEl && nextEl){
          timerEl.textContent=formatTime(diff);
          timerEl.className='timer';
          if(diff<=0) timerEl.classList.add('spawned');
          else if(diff<=10*60*1000) timerEl.classList.add('alert');
          nextEl.textContent=`Next: ${formatDateTime(next)}`;
        }
        if(card){
          card.style.order=Math.floor(diff/1000);
          card.classList.remove('upcoming','manual');
          if(diff>0 && diff<=threshold) card.classList.add('upcoming');
          if(b.manual) card.classList.add('manual');
        }
      });

      if(soonestBoss){
        document.getElementById('next-banner').textContent=
          `Next Boss: ${soonestBoss.name} at ${formatDateTime(soonestBoss.nextSpawn)}`;
        document.querySelectorAll('.boss').forEach(c=>c.classList.remove('highlight'));
        const highlightCard=document.getElementById(`card-${nameToId(soonestBoss.name)}`);
        if(highlightCard) highlightCard.classList.add('highlight');
      }
    }

    function buildGrid(){
      const grid=document.getElementById('boss-grid');
      bosses.forEach(b=>{
        const id=nameToId(b.name);
        const card=document.createElement('div');
        card.className='boss';
        card.id=`card-${id}`;
        card.innerHTML=`
          <h2>${b.name}</h2>
          <div id="timer-${id}" class="timer">Loading...</div>
          <div id="next-${id}" class="next-time">Next: Calculating...</div>
        `;
        grid.appendChild(card);
      });
    }

    buildGrid();
    setInterval(updateTimers,1000);
    updateTimers();
  </script>
</body>
</html>

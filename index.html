<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SlashPH Lordnine Boss Timers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    #next-banner {
      background: #222;
      padding: 10px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .boss {
      background: #333;
      border-radius: 10px;
      padding: 15px;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      background-size: cover;
      background-position: center;
      min-height: 180px;
      transition: 0.3s;
    }
    .boss.highlight {
      border: 3px solid gold;
      transform: scale(1.05);
    }
    .boss.noinfo {
      filter: grayscale(100%) brightness(0.5);
      opacity: 0.6;
    }
    .boss h2 {
      margin: 0 0 10px;
      font-size: 1.3em;
      text-shadow: 1px 1px 3px #000;
    }
    .timer {
      font-size: 1.2em;
      font-weight: bold;
    }
    .next-time {
      font-size: 0.9em;
    }
    .interval-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div id="next-banner">🔔 Next Boss: NONE</div>
  <div class="grid" id="boss-grid"></div>

  <script>
    const bosses = [
      { name: "General Aquleus", interval: 8, lastKilled: null, nextSpawn: null },
      { name: "Lord Nine", interval: 12, lastKilled: null, nextSpawn: null },
      { name: "Dragon King", interval: 24, lastKilled: null, nextSpawn: null }
    ];

    function formatTime(ms){
      if(ms <= 0) return "00:00:00";
      const total = Math.floor(ms/1000);
      const h = String(Math.floor(total/3600)).padStart(2,'0');
      const m = String(Math.floor((total%3600)/60)).padStart(2,'0');
      const s = String(total%60).padStart(2,'0');
      return `${h}:${m}:${s}`;
    }

    function formatDateTime(dt){
      return dt.toLocaleString('en-US',{ weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
    }

    function renderBosses(){
      const grid = document.getElementById("boss-grid");
      grid.innerHTML = "";
      bosses.forEach((b,i)=>{
        const card = document.createElement("div");
        card.className = "boss";
        card.id = "boss-"+i;

        const badge = document.createElement("div");
        badge.className = "interval-badge";
        badge.textContent = b.interval+"h";
        card.appendChild(badge);

        const h2 = document.createElement("h2");
        h2.textContent = b.name;
        card.appendChild(h2);

        const timer = document.createElement("div");
        timer.className = "timer";
        timer.textContent = "00:00:00";
        card.appendChild(timer);

        const nextTime = document.createElement("div");
        nextTime.className = "next-time";
        nextTime.textContent = "Next: ---";
        card.appendChild(nextTime);

        grid.appendChild(card);
      });
    }

    function updateTimers(){
      const now = new Date();
      bosses.forEach((b,i)=>{
        const card = document.getElementById("boss-"+i);
        const timerEl = card.querySelector(".timer");
        const nextEl = card.querySelector(".next-time");

        let timerText="", nextText="";

        if(b.nextSpawn === null){
          timerText = "NO INFO";
          nextText = "Next: NO INFO";
          card.classList.add("noinfo");
        } else {
          const remaining = b.nextSpawn - now;
          timerText = formatTime(remaining);
          nextText = "Next: " + formatDateTime(b.nextSpawn);

          // alisin "noinfo" kapag may bagong spawn info
          if(card.classList.contains("noinfo")){
            card.classList.remove("noinfo");
          }

          if(remaining < 0){
            timerEl.style.color = "lime";
            timerText = "SPAWNED!";
          } else if(remaining < 10*60*1000){
            timerEl.style.color = "red";
          } else {
            timerEl.style.color = "white";
          }
        }

        timerEl.textContent = timerText;
        nextEl.textContent = nextText;
      });

      // Highlight pinakamalapit
      const valid = bosses.filter(b=>b.nextSpawn!==null);
      if(valid.length > 0){
        valid.sort((a,b)=>a.nextSpawn - b.nextSpawn);
        const nextBoss = valid[0];
        document.getElementById("next-banner").textContent =
          "🔔 Next Boss: " + nextBoss.name + " — " + formatDateTime(nextBoss.nextSpawn);

        bosses.forEach((b,i)=>{
          const card = document.getElementById("boss-"+i);
          if(b === nextBoss) card.classList.add("highlight");
          else card.classList.remove("highlight");
        });
      } else {
        document.getElementById("next-banner").textContent = "🔔 Next Boss: NONE";
        bosses.forEach((b,i)=>{
          document.getElementById("boss-"+i).classList.remove("highlight");
        });
      }
    }

    renderBosses();
    setInterval(updateTimers, 1000);

    // 🔧 Sample spawn data para makita agad ang effect
    setTimeout(()=>{
      bosses[0].nextSpawn = new Date(Date.now() + 30*60*1000); // 30 min
      bosses[1].nextSpawn = new Date(Date.now() + 2*60*60*1000); // 2h
      bosses[2].nextSpawn = null; // NO INFO (gray)
    },1000);
  </script>
</body>
</html>

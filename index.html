<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SlashPH Lordnine Boss Timers</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Roboto+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: linear-gradient(to right, #0f0f0f, #1c1c1c);
      font-family: 'Roboto Mono', monospace;
      color: #e4e4e4;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #111;
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #f5f5f5;
      letter-spacing: 1px;
      border-bottom: 2px solid #333;
    }
    #next-banner {
      text-align: center;
      font-size: 1.3rem;
      margin: 15px;
      color: #00ff99;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
      gap: 15px;
      padding: 20px;
    }
    .boss {
      position: relative;
      background: #1f1f1f;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s, box-shadow 0.3s;
      background-size: 40% auto;
      background-repeat: no-repeat;
      background-position: right center;
    }
    .boss:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }
    .boss.highlight {
      border: 2px solid #00ffcc;
      background: #262626;
    }
    .boss h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #ffcc00;
    }
    .timer {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #00ffcc;
    }
    .timer.spawned {
      color: #00ff00;
    }
    .timer.alert {
      animation: flash 1s infinite;
      font-weight: bold;
    }
    .next-time {
      font-size: 0.9rem;
      color: #aaa;
    }

    /* interval text upper right */
    .boss .intervals {
      position: absolute;
      top: 10px;
      right: 10px;
      color: red;            /* 🔴 red text */
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 3;
    }

    @keyframes flash {
      0% { color: #ff4444; }
      50% { color: #ffffff; }
      100% { color: #ff4444; }
    }
  </style>
</head>
<body>
  <header>SlashPH Lordnine Boss Timers</header>
  <div id="next-banner">Next Boss: Loading...</div>
  <div class="grid" id="boss-grid"></div>

  <script>
    const bosses = [
      { name:'Undomiel', intervals:[24], lastKilled:'2025-08-30 12:05 AM' },
      { name:'Lady Daliah', intervals:[18], lastKilled:'2025-08-30 12:25 PM' },
      { name:'Venatus', intervals:[10], lastKilled:'2025-08-30 11:13 PM' },
      { name:'Viorent', intervals:[10], lastKilled:'2025-08-30 11:15 PM' },
      { name:'Ego', intervals:[21], lastKilled:'2025-08-30 10:49 AM' },
      { name:'Thymele', intervals:[10,24], lastKilled:'2025-08-30 11:30 AM' },
      { name:'Araneo', intervals:[24], lastKilled:'2025-08-30 11:06 PM' },
      { name:'Livera', intervals:[24], lastKilled:'2025-08-30 11:16 PM' },
      { name:'Clemantis', intervals:[10,24], lastKilled:'2025-08-30 11:30 AM' },
      { name:'Saphirus', intervals:[10,24], lastKilled:'2025-08-30 05:00 PM' },
      { name:'Neutro', intervals:[10,24], lastKilled:'2025-08-30 07:00 PM' },
      { name:'General Aquleus', intervals:[29], lastKilled:'2025-08-30 02:00 AM' },
      { name:'Amentis', intervals:[29], lastKilled:'2025-08-30 03:00 AM' },
      { name:'Baron Braudmore', intervals:[32], lastKilled:'2025-08-30 05:00 AM' },
      { name:'Milavy', intervals:[10], lastKilled:'2025-08-30 03:00 PM' },
      { name:'Wannitas', intervals:[48], lastKilled:'2025-08-30 07:00 AM' },
      { name:'Metus', intervals:[48], lastKilled:'2025-08-30 08:00 AM' },
      { name:'Duplican', intervals:[48], lastKilled:'2025-08-30 09:00 AM' },
      { name:'Shuliar', intervals:[35], lastKilled:'2025-08-30 10:00 AM' },
      { name:'Ringor', intervals:[10], lastKilled:'2025-08-30 05:00 PM' },
      { name:'Roderick', intervals:[10], lastKilled:'2025-08-30 07:00 PM' },
      { name:'Gareth', intervals:[32], lastKilled:'2025-08-30 11:00 AM' },
      { name:'Titore', intervals:[37], lastKilled:'2025-08-30 01:00 PM' },
      { name:'Larba', intervals:[35], lastKilled:'2025-08-30 02:00 PM' },
      { name:'Catena', intervals:[35], lastKilled:'2025-08-30 03:00 PM' },
      { name:'Auraq', intervals:[10,24], lastKilled:'2025-08-30 09:00 PM' }
    ];

    function nameToId(name){ return name.toLowerCase().replace(/\s+/g,'-'); }

    function formatTime(ms){
      if(ms<=0) return "SPAWNED!";
      let s=Math.floor(ms/1000);
      const d=Math.floor(s/86400); s%=86400;
      const h=Math.floor(s/3600); s%=3600;
      const m=Math.floor(s/60); s%=60;
      return (d>0?d+"d ":"")+(h>0?h+"h ":"")+(m>0?m+"m ":"")+s+"s";
    }

    function formatDateTime(dt){
      if(!(dt instanceof Date)) return '';
      const opts = { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
      return dt.toLocaleString('en-US', opts) + " (PH)";
    }

    function computeNextSpawn(lastKilledStr, intervals) {
      let last = new Date(lastKilledStr);
      let now = new Date();
      let nextSpawns = intervals.map(h => {
        let next = new Date(last.getTime() + h*3600*1000);
        while(next < now){
          next = new Date(next.getTime() + h*3600*1000);
        }
        return next;
      });
      nextSpawns.sort((a,b)=>a-b);
      return nextSpawns[0];
    }

    function updateTimers(){
      const now = new Date();

      bosses.forEach(b => {
        b.nextSpawn = computeNextSpawn(b.lastKilled, b.intervals);
      });

      bosses.sort((a,b) => a.nextSpawn - b.nextSpawn);

      const grid = document.getElementById('boss-grid');
      grid.innerHTML = '';

      let soonestBoss = bosses[0];

      bosses.forEach(b => {
        const id = nameToId(b.name);
        const remaining = b.nextSpawn - now;
        const card = document.createElement('div');
        card.className = 'boss';
        card.id = `card-${id}`;
        card.style.backgroundImage = `url('SlashPH-Lordnine-Boss-Timer/${b.name}.png')`;
        card.innerHTML = `
          <div class="intervals">${b.intervals.join("h, ")}h</div>
          <h2>${b.name}</h2>
          <div id="timer-${id}" class="timer">${formatTime(remaining)}</div>
          <div id="next-${id}" class="next-time">Next: ${formatDateTime(b.nextSpawn)}</div>
        `;
        if(b === soonestBoss) card.classList.add('highlight');
        grid.appendChild(card);

        const timerEl = card.querySelector(`#timer-${id}`);
        if(remaining <= 0){
          timerEl.classList.add('spawned');
        } else if(remaining <= 10*60*1000){
          timerEl.classList.add('alert');
        }
      });

      if(soonestBoss){
        document.getElementById('next-banner').textContent = 
          `Next Boss: ${soonestBoss.name} at ${formatDateTime(soonestBoss.nextSpawn)}`;
      }
    }

    function buildGrid(){
      const grid=document.getElementById('boss-grid');
      bosses.forEach(b=>{
        const id=nameToId(b.name);
        const card=document.createElement('div');
        card.className='boss';
        card.id=`card-${id}`;
        card.style.backgroundImage = `url('SlashPH-Lordnine-Boss-Timer/${b.name}.png')`;
        card.innerHTML=`
          <div class="intervals">${b.intervals.join("h, ")}h</div>
          <h2>${b.name}</h2>
          <div id="timer-${id}" class="timer">Loading...</div>
          <div id="next-${id}" class="next-time">Next: Calculating...</div>
        `;
        grid.appendChild(card);
      });
    }

    buildGrid();
    setInterval(updateTimers, 1000);
    updateTimers();
  </script>
</body>
</html>
